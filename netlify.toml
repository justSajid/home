[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect bare directory paths to their index.html
[[redirects]]
  from = "/posts/:slug"
  to = "/posts/:slug/index.html"
  status = 200

[[redirects]]
  from = "/categories/:slug"
  to = "/categories/:slug/index.html"
  status = 200

[[redirects]]
  from = "/tags/:slug"
  to = "/tags/:slug/index.html"
  status = 200

[[redirects]]
  from = "/blog/page/:page"
  to = "/blog/page/:page/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
